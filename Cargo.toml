cargo-features = ["profile-rustflags"]

[package]
name = "rpsarc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
binrw = { version = "0.15.1", default-features = false, features = ["std"] }
clap = { version = "4.6.3", features = ["derive"] }
md5 = "0.8.1"
parseq = "0.1.5"
relative-path = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flate2 = { version = "1", features = ["zlib"] }


[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
